<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Betaalautomaat — P1 Parking Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">

    <aside class="layout__panel">
        <header class="panel__header">⚙ Admin Panel</header>
        <section class="panel__section">
            <h2 class="panel__section-title">Status apparaat</h2>
            <div class="panel__row">
                <label class="panel__label" for="cfg-kaart-vast">Kaartje vastzit in kaartmondje<span class="panel__label-sub">Waarschuwing bij ticket invoeren</span></label>
                <label class="toggle"><input type="checkbox" id="cfg-kaart-vast" onchange="showIdle()"><span class="toggle__track"></span></label>
            </div>
            <div class="panel__row">
                <label class="panel__label" for="cfg-munt-defect">Muntenverwerker defect<span class="panel__label-sub">Melding bij contant kiezen</span></label>
                <label class="toggle"><input type="checkbox" id="cfg-munt-defect" onchange="showIdle()"><span class="toggle__track"></span></label>
            </div>
            <div class="panel__row">
                <label class="panel__label" for="cfg-brief-defect">Briefgeld gleuf geblokkeerd<span class="panel__label-sub">Alleen munten mogelijk</span></label>
                <label class="toggle"><input type="checkbox" id="cfg-brief-defect" onchange="showIdle()"><span class="toggle__track"></span></label>
            </div>
            <div class="panel__row">
                <label class="panel__label" for="cfg-gepast">Gepast betalen vereist<span class="panel__label-sub">Geen wisselgeld beschikbaar</span></label>
                <label class="toggle"><input type="checkbox" id="cfg-gepast" onchange="showIdle()"><span class="toggle__track"></span></label>
            </div>
            <div class="panel__row">
                <label class="panel__label" for="cfg-barcode-defect">Barcode scanner defect<span class="panel__label-sub">Alleen kaartmondje beschikbaar</span></label>
                <label class="toggle"><input type="checkbox" id="cfg-barcode-defect" onchange="showIdle()"><span class="toggle__track"></span></label>
            </div>
        </section>
        <section class="panel__section">
            <h2 class="panel__section-title">Parkeerticket</h2>
            <div class="panel__row">
                <label class="panel__label" for="cfg-ticket-fout">Ticket beschadigd / kwijt<span class="panel__label-sub">Foutmelding bij invoer → kenteken route</span></label>
                <label class="toggle"><input type="checkbox" id="cfg-ticket-fout" onchange="showIdle()"><span class="toggle__track"></span></label>
            </div>
            <div>
                <label class="panel__label" for="cfg-duur">Parkeerduur & bedrag</label>
                <select class="panel__select" id="cfg-duur" onchange="showIdle()">
                    <option value="30m|1.00">30 min — € 1,00</option>
                    <option value="1u|2.00">1 uur — € 2,00</option>
                    <option value="2u 15m|3.50" selected>2u 15 min — € 3,50</option>
                    <option value="4u|6.00">4 uur — € 6,00</option>
                    <option value="8u|12.00">8 uur — € 12,00</option>
                    <option value="1 dag|22.00">1 dag — € 22,00</option>
                </select>
            </div>
            <div style="margin-top:8px;">
                <label class="panel__label" for="cfg-garage">Garage locatie</label>
                <select class="panel__select" id="cfg-garage" onchange="showIdle()">
                    <option value="P8 Flevo-garage" selected>P8 Flevo-garage</option>
                    <option value="P6 Centrum">P6 Centrum</option>
                    <option value="P12 Station">P12 Station</option>
                    <option value="P3 Ziekenhuis">P3 Ziekenhuis</option>
                </select>
            </div>
        </section>
        <section class="panel__section">
            <h2 class="panel__section-title">Kenteken registraties</h2>
            <div class="kenteken-list" id="kenteken-list"></div>
            <div class="kenteken-add">
                <input class="kenteken-add__input" type="text" id="kenteken-new-plate" placeholder="AB-123-C" maxlength="9" oninput="this.value=this.value.toUpperCase()">
                <input class="kenteken-add__input kenteken-add__input--price" type="text" id="kenteken-new-price" placeholder="€ bedrag">
                <button class="kenteken-add__btn" onclick="addKenteken()">+</button>
            </div>
        </section>
        <section class="panel__section">
            <h2 class="panel__section-title">Intercom / Meldkamer</h2>
            <label class="panel__label" for="cfg-wachtrij">Wachtrij (personen voor bezoeker)</label>
            <select class="panel__select" id="cfg-wachtrij">
                <option value="0">Geen wachtrij</option>
                <option value="1" selected>1 persoon voor u</option>
                <option value="2">2 personen voor u</option>
                <option value="3">3 personen voor u</option>
            </select>
        </section>
        <div class="panel__footer">
            <button class="panel__reset-btn" onclick="showIdle()">↺ Automaat resetten</button>
        </div>
    </aside>

    <main class="layout__stage">
        <div class="scene">
            <div class="machine-wrap" id="machine-wrap">

                <!--
                  SVG viewBox: 460 x 620

                  LINKERHELFT (x 30..240):
                    scherm (groot)
                    ticket bak (grijze bak, ticket in/uit)
                    oranje LED strip
                    barcode scanner (rood)
                    wisselgeld returnbak (zwart vierkant)

                  RECHTERHELFT (x 245..430):
                    speaker
                    pinpad blok (zwart, met blauw scherm + toetsen)
                    pinpas gleuf (chip betalen)
                    munten verticale gleuf (zilver)
                    kwitantie gleuf (horizontaal)
                    munten invoer (klein vierkantje)
                    briefgeld gleuf (rechtsonder)
                -->

                <svg class="machine-svg" viewBox="0 0 460 620" xmlns="http://www.w3.org/2000/svg">

                    <!-- Blauw bord -->
                    <rect x="8"  y="0"  width="444" height="28" rx="7" fill="#0033BB"/>
                    <text x="230" y="19" text-anchor="middle" fill="white" font-size="11"
                          font-weight="800" font-family="Inter,sans-serif" letter-spacing="3">P  BETAALAUTOMAAT  P</text>
                    <rect x="8"  y="24" width="444" height="4" rx="0" fill="#4477FF" opacity="0.5"/>

                    <!-- Kast -->
                    <rect x="10" y="30" width="440" height="578" rx="22" fill="#E0E0E0" stroke="#C0C0C0" stroke-width="1.5"/>
                    <rect x="10" y="30" width="18"  height="578" rx="10" fill="white" opacity="0.25"/>
                    <rect x="432" y="30" width="18" height="578" rx="10" fill="#999"  opacity="0.15"/>

                    <!-- Frontpaneel donker -->
                    <rect x="28" y="48" width="404" height="552" rx="12" fill="#282828"/>

                    <!-- ════════════════════════════════════════════════
                         LINKERHELFT
                    ════════════════════════════════════════════════ -->

                    <!-- SCHERM — groot staand -->
                    <rect x="36"  y="56" width="196" height="262" rx="5" fill="#0A0A0A"/>
                    <rect x="40"  y="60" width="188" height="254" rx="3" fill="#111827"/>
                    <!-- viewBox 460x620, screen: x=40 y=60 w=188 h=254 -->

                    <!-- TICKET BAK — grijze uitstekende bak onder scherm -->
                    <!-- De grote bak waar ticket in en uit gaat -->
                    <rect x="36"  y="328" width="196" height="58" rx="8" fill="#B8B8B8" stroke="#999" stroke-width="1.5"/>
                    <rect x="42"  y="334" width="184" height="46" rx="6" fill="#A8A8A8"/>
                    <!-- schaduw bovenkant -->
                    <rect x="42"  y="334" width="184" height="8"  rx="4" fill="#888" opacity="0.5"/>
                    <!-- gleuf in het midden van de bak -->
                    <rect x="56"  y="352" width="156" height="16" rx="4" fill="#111" stroke="#555" stroke-width="1.5"/>
                    <!-- LED boven de bak -->
                    <circle id="kaart-led" cx="208" cy="333" r="5" fill="#333"/>
                    <!-- label -->
                    <text x="134" y="326" text-anchor="middle" fill="#666" font-size="7"
                          font-family="Inter,sans-serif" font-weight="600">TICKET IN / UIT</text>

                    <!-- hitbox ticket bak -->
                    <rect id="hw-ticket" x="34"  y="322" width="200" height="68" rx="8"
                          fill="transparent" stroke="transparent" style="cursor:pointer;" onclick="onHwClick('ticket')"/>
                    <rect id="glow-ticket" x="34" y="322" width="200" height="68" rx="8"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- ORANJE LED STRIP onder ticket bak -->
                    <rect x="56"  y="398" width="120" height="8" rx="4" fill="#FF8800" opacity="0.7"/>
                    <rect id="glow-led" x="54" y="396" width="124" height="12" rx="4"
                          fill="transparent" stroke="transparent" pointer-events="none"/>

                    <!-- BARCODE SCANNER — rood vakje -->
                    <rect x="56"  y="414" width="68" height="52" rx="5" fill="#111"/>
                    <rect x="60"  y="418" width="60" height="44" rx="3" fill="#5A0000"/>
                    <line x1="64" y1="440" x2="116" y2="440" stroke="#FF2222" stroke-width="2.5" opacity="0.9"/>
                    <line x1="64" y1="432" x2="116" y2="432" stroke="#FF3333" stroke-width="1"   opacity="0.4"/>
                    <line x1="64" y1="448" x2="116" y2="448" stroke="#FF3333" stroke-width="1"   opacity="0.4"/>
                    <text x="90"  y="410" text-anchor="middle" fill="#555" font-size="7"
                          font-family="Inter,sans-serif">BARCODE</text>

                    <rect id="hw-barcode" x="54"  y="408" width="72" height="60" rx="5"
                          fill="transparent" stroke="transparent" style="cursor:pointer;" onclick="onHwClick('barcode')"/>
                    <rect id="glow-barcode" x="54" y="408" width="72" height="60" rx="5"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- WISSELGELD RETURNBAK — zwart vierkant onder barcode -->
                    <rect x="56"  y="480" width="68" height="52" rx="5" fill="#111"/>
                    <rect x="60"  y="484" width="60" height="44" rx="3" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
                    <!-- gleufje in de returnbak -->
                    <rect x="66"  y="498" width="48" height="14" rx="3" fill="#0A0A0A" stroke="#444" stroke-width="1"/>
                    <text x="90"  y="476" text-anchor="middle" fill="#555" font-size="7"
                          font-family="Inter,sans-serif">WISSELGELD</text>

                    <rect id="hw-wissel" x="54"  y="474" width="72" height="64" rx="5"
                          fill="transparent" stroke="transparent" pointer-events="none"/>
                    <rect id="glow-wissel" x="54" y="474" width="72" height="64" rx="5"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- ════════════════════════════════════════════════
                         RECHTERHELFT
                    ════════════════════════════════════════════════ -->

                    <!-- SPEAKER bovenin rechts -->
                    <rect x="246" y="58" width="174" height="52" rx="5" fill="#1A1A1A"/>
                    <g stroke="#444" stroke-width="1.5" opacity="0.5">
                        <line x1="256" y1="68"  x2="412" y2="68"/>
                        <line x1="256" y1="75"  x2="412" y2="75"/>
                        <line x1="256" y1="82"  x2="412" y2="82"/>
                        <line x1="256" y1="89"  x2="412" y2="89"/>
                        <line x1="256" y1="96"  x2="412" y2="96"/>
                        <line x1="256" y1="103" x2="412" y2="103"/>
                    </g>

                    <!-- PINPAD BLOK — groot zwart blok met blauw scherm + toetsen -->
                    <rect x="246" y="118" width="174" height="192" rx="6" fill="#0D0D0D"/>

                    <!-- Blauw pinpad scherm bovenin het blok -->
                    <rect x="254" y="126" width="114" height="68" rx="4" fill="#001A4A" stroke="#003399" stroke-width="1.5"/>
                    <rect x="258" y="130" width="106" height="60" rx="3" fill="#001A4A"/>
                    <!-- Idle tekst — verborgen tijdens pincode invoer -->
                    <text id="pin-screen-idle" x="311" y="152" text-anchor="middle" fill="#4488FF"
                          font-size="8" font-weight="600" font-family="Inter,sans-serif">BETAAL</text>
                    <text id="pin-screen-idle2" x="311" y="168" text-anchor="middle" fill="#336699"
                          font-size="9" font-family="Inter,sans-serif">)))</text>
                    <!-- PIN dots — zichtbaar tijdens pincode invoer -->
                    <text id="pin-screen-label" x="311" y="147" text-anchor="middle" fill="#4488FF"
                          font-size="7" font-family="Inter,sans-serif" visibility="hidden">PINCODE</text>
                    <text id="pin-svg-dot-1" x="279" y="168" text-anchor="middle" fill="#336699"
                          font-size="16" font-family="Inter,sans-serif" visibility="hidden">○</text>
                    <text id="pin-svg-dot-2" x="299" y="168" text-anchor="middle" fill="#336699"
                          font-size="16" font-family="Inter,sans-serif" visibility="hidden">○</text>
                    <text id="pin-svg-dot-3" x="319" y="168" text-anchor="middle" fill="#336699"
                          font-size="16" font-family="Inter,sans-serif" visibility="hidden">○</text>
                    <text id="pin-svg-dot-4" x="339" y="168" text-anchor="middle" fill="#336699"
                          font-size="16" font-family="Inter,sans-serif" visibility="hidden">○</text>
                    <!-- Contactloos icoontje -->
                    <text x="378" y="162" text-anchor="middle" fill="#4488FF" font-size="16"
                          font-family="Inter,sans-serif" id="pin-icon-svg">)))</text>

                    <!-- Pinpad toetsen — 3x4 grid -->
                    <g fill="#2A2A2A" stroke="#3A3A3A" stroke-width="0.5">
                        <!-- rij 1 -->
                        <rect x="258" y="204" width="32" height="20" rx="3"/>
                        <rect x="295" y="204" width="32" height="20" rx="3"/>
                        <rect x="332" y="204" width="32" height="20" rx="3"/>
                        <!-- rij 2 -->
                        <rect x="258" y="230" width="32" height="20" rx="3"/>
                        <rect x="295" y="230" width="32" height="20" rx="3"/>
                        <rect x="332" y="230" width="32" height="20" rx="3"/>
                        <!-- rij 3 -->
                        <rect x="258" y="256" width="32" height="20" rx="3"/>
                        <rect x="295" y="256" width="32" height="20" rx="3"/>
                        <rect x="332" y="256" width="32" height="20" rx="3"/>
                        <!-- rij 4 -->
                        <rect x="258" y="282" width="32" height="20" rx="3"/>
                        <rect x="295" y="282" width="32" height="20" rx="3"/>
                        <rect x="332" y="282" width="32" height="20" rx="3"/>
                    </g>
                    <!-- cijfers op toetsen — klikbaar voor pincode invoer -->
                    <g fill="#666" font-size="9" font-family="Inter,sans-serif" text-anchor="middle">
                        <text x="274" y="218">1</text><text x="311" y="218">2</text><text x="348" y="218">3</text>
                        <text x="274" y="244">4</text><text x="311" y="244">5</text><text x="348" y="244">6</text>
                        <text x="274" y="270">7</text><text x="311" y="270">8</text><text x="348" y="270">9</text>
                        <text x="274" y="296" fill="#3A7A3A" font-size="11">✓</text>
                        <text x="311" y="296">0</text>
                        <text x="348" y="296" fill="#7A3A3A" font-size="11">✕</text>
                    </g>
                    <!-- Transparante clickable zones op elke toets -->
                    <g style="cursor:pointer;">
                        <rect x="258" y="204" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('1')"/>
                        <rect x="295" y="204" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('2')"/>
                        <rect x="332" y="204" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('3')"/>
                        <rect x="258" y="230" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('4')"/>
                        <rect x="295" y="230" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('5')"/>
                        <rect x="332" y="230" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('6')"/>
                        <rect x="258" y="256" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('7')"/>
                        <rect x="295" y="256" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('8')"/>
                        <rect x="332" y="256" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('9')"/>
                        <rect x="258" y="282" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('ok')"/>
                        <rect x="295" y="282" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('0')"/>
                        <rect x="332" y="282" width="32" height="20" rx="3" fill="transparent" onclick="terminalToets('clear')"/>
                    </g>

                    <!-- Intercom knopje rechts van pinpad scherm -->
                    <rect x="376" y="128" width="36" height="22" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
                    <text x="394" y="143" text-anchor="middle" font-size="12" font-family="Inter,sans-serif">📞</text>
                    <rect id="hw-intercom" x="374" y="126" width="40" height="26" rx="4"
                          fill="transparent" stroke="transparent" style="cursor:pointer;" onclick="showIntercom()"/>
                    <rect id="glow-intercom" x="374" y="126" width="40" height="26" rx="4"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- PINPAS GLEUF — kaart insteken voor chip betalen, onder pinpad -->
                    <rect x="246" y="318" width="174" height="36" rx="5" fill="#B8B8B8" stroke="#999" stroke-width="1.5"/>
                    <rect x="252" y="324" width="162" height="24" rx="3" fill="#A8A8A8"/>
                    <rect x="252" y="324" width="162" height="5"  rx="2" fill="#888" opacity="0.4"/>
                    <rect x="260" y="330" width="146" height="12" rx="3" fill="#0A0A0A" stroke="#555" stroke-width="1"/>
                    <circle id="pin-led" cx="248" cy="330" r="4" fill="#333"/>
                    <text x="333" y="314" text-anchor="middle" fill="#666" font-size="7"
                          font-family="Inter,sans-serif" font-weight="600">PINPAS GLEUF</text>

                    <rect id="hw-pinpas" x="244" y="312" width="178" height="44" rx="5"
                          fill="transparent" stroke="transparent" style="cursor:pointer;" onclick="onHwClick('pinpas')"/>
                    <rect id="glow-pinpas" x="244" y="312" width="178" height="44" rx="5"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- MUNTEN INVOER VERTICAAL — zilveren gleuf naast pinpad -->
                    <!-- Dit is de verticale gleuf bij het zilveren deel -->
                    <rect x="246" y="368" width="46" height="80" rx="5" fill="#BDBDBD" stroke="#999" stroke-width="1.5"/>
                    <rect x="252" y="374" width="34" height="68" rx="3" fill="#AAAAAA"/>
                    <!-- verticale gleuf -->
                    <rect x="260" y="380" width="18" height="56" rx="4" fill="#0A0A0A" stroke="#555" stroke-width="1"/>
                    <text x="269" y="364" text-anchor="middle" fill="#666" font-size="6"
                          font-family="Inter,sans-serif" font-weight="600">MUNTEN</text>

                    <rect id="hw-munten" x="244" y="362" width="50" height="92" rx="5"
                          fill="transparent" stroke="transparent" pointer-events="none"/>
                    <rect id="glow-munten" x="244" y="362" width="50" height="92" rx="5"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- KWITANTIE GLEUF — horizontaal, rechts van munten -->
                    <rect x="302" y="368" width="118" height="36" rx="5" fill="#111"/>
                    <rect x="308" y="374" width="106" height="22" rx="3" fill="#0A0A0A" stroke="#444" stroke-width="1"/>
                    <text x="361" y="364" text-anchor="middle" fill="#555" font-size="7"
                          font-family="Inter,sans-serif">KWITANTIE</text>

                    <rect id="hw-kwitantie" x="300" y="362" width="122" height="48" rx="5"
                          fill="transparent" stroke="transparent" pointer-events="none"/>
                    <rect id="glow-kwitantie" x="300" y="362" width="122" height="48" rx="5"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- BRIEFGELD GLEUF — rechtsonder -->
                    <rect x="368" y="422" width="52" height="44" rx="5" fill="#111"/>
                    <rect x="372" y="432" width="44" height="16" rx="3" fill="#0A0A0A" stroke="#444" stroke-width="1"/>
                    <text x="394" y="418" text-anchor="middle" fill="#555" font-size="7"
                          font-family="Inter,sans-serif">BRIEFGELD</text>

                    <rect id="hw-brief" x="300" y="416" width="122" height="58" rx="5"
                          fill="transparent" stroke="transparent" pointer-events="none"/>
                    <rect id="glow-brief" x="300" y="416" width="122" height="58" rx="5"
                          fill="transparent" stroke="transparent" stroke-width="3" pointer-events="none"/>

                    <!-- Scheidt & Bachmann -->
                    <text x="160" y="552" text-anchor="middle" fill="#555" font-size="9"
                          font-weight="600" font-family="Inter,sans-serif" letter-spacing="1">SCHEIDT&amp;BACHMANN</text>
                    <circle cx="270" cy="549" r="10" fill="none" stroke="#555" stroke-width="1.5"/>
                    <text x="270" y="553" text-anchor="middle" fill="#555" font-size="8"
                          font-family="Inter,sans-serif">SB</text>

                    <!-- Voet -->
                    <rect x="44"  y="568" width="372" height="14" rx="4" fill="#C8C8C8"/>
                    <rect x="54"  y="580" width="352" height="8"  rx="3" fill="#B8B8B8"/>
                    <rect x="10"  y="602" width="440" height="5"  rx="2" fill="#4477FF" opacity="0.35"/>

                </svg>

                <!-- HTML scherm overlay -->
                <!-- viewBox 460x620, screen: x=40 y=60 w=188 h=254 -->
                <!-- left=40/460=8.70%, top=60/620=9.68%, w=188/460=40.87%, h=254/620=40.97% -->
                <div class="machine-screen" id="machine-screen">
                    <div class="screen" id="screen">
                        <div class="screen__content" id="screen-content"></div>
                        <div class="screen__progress" id="progress"></div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>
<script src="app.js"></script>
</body>
</html>
